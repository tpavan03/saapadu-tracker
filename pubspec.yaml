name: saapadu
description: Offline-first South Indian calorie, wellness, and fasting tracker.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/south_indian_foods.json
    - assets/fonts/OFL-DMSans.txt
    - assets/fonts/OFL-Sora.txt
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
